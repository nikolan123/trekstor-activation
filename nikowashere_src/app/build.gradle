plugins {
    id "com.android.application"
}

android {
    namespace "de.readerportal.nikowashere"
    compileSdk 35

    defaultConfig {
        applicationId "de.readerportal.nikowashere"
        minSdk 15
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
